services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - orchestrator-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://orchestrator:orchestrator@postgres:5432/orchestrator
      API_TOKEN: ${API_TOKEN:-local-development-token}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-replace-me}
      ARTIFACT_ROOT: /app/artifacts
      WORKSPACE_ROOT: /app/workspaces
      DESIGN_GENERATION_TIMEOUT_SECONDS: ${DESIGN_GENERATION_TIMEOUT_SECONDS:-300}
      IMPLEMENTATION_TIMEOUT_SECONDS: ${IMPLEMENTATION_TIMEOUT_SECONDS:-1800}
    ports:
      - "8000:8000"
    volumes:
      - orchestrator-workspaces:/app/workspaces
      - orchestrator-artifacts:/app/artifacts
      - codex-auth:/root/.codex
      - claude-auth:/root/.claude
      - ${SSH_KEY_DIR:-${HOME}/.ssh}:/root/.ssh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_API_TOKEN: ${API_TOKEN:-local-development-token}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  orchestrator-postgres:
  orchestrator-workspaces:
  orchestrator-artifacts:
  codex-auth:
  claude-auth:
